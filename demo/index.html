<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>step-narrator demo</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1b1d22; --muted: #555b66;
    --line: #1b1d22; --accent: #0f6e63; --accent-ink: #ffffff; --err: #b3261e;
    --focus: #1f5fbf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --card: #1b1e24; --ink: #eef0f3; --muted: #b4bac4;
      --line: #eef0f3; --accent: #3cc5b2; --accent-ink: #0b1513; --err: #ff8a80;
      --focus: #8ab4ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 2px solid var(--line); padding: 20px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
  .lang { display: inline-flex; border: 2px solid var(--line); }
  .lang button { border: 0; background: transparent; color: var(--ink); min-width: 48px; min-height: 44px; font: inherit; font-weight: 700; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .listen {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
    border: 2px solid var(--line); background: transparent; color: var(--ink);
    font: inherit; font-weight: 700; cursor: pointer;
  }
  .listen svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .listen .waves { opacity: .35; }
  .listen[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .listen[aria-pressed="true"] .waves { opacity: 1; }
  .bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 6px; }
  .bar span { height: 6px; background: var(--muted); opacity: .25; }
  .bar span.done { background: var(--accent); opacity: 1; }
  .count { margin: 0 0 4px; color: var(--muted); font-weight: 700; font-size: 15px; letter-spacing: .02em; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; }
  h1:focus { outline: none; }
  .hint { margin: 0 0 18px; color: var(--muted); }
  label { display: block; font-weight: 700; margin-bottom: 6px; }
  input {
    width: 100%; min-height: 50px; padding: 10px 12px; font: inherit; color: var(--ink);
    background: var(--card); border: 2px solid var(--line); border-radius: 0;
  }
  .err { color: var(--err); font-weight: 700; margin: 8px 0 0; }
  .nav { display: flex; gap: 12px; margin-top: 22px; }
  .nav button, .again {
    min-height: 50px; padding: 0 22px; font: inherit; font-weight: 700; cursor: pointer;
    border: 2px solid var(--line); background: transparent; color: var(--ink);
  }
  .nav .go { background: var(--ink); color: var(--card); flex: 1; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
  dt { font-weight: 700; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .note { color: var(--muted); font-size: 15px; margin: 16px 2px 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="top">
      <div class="lang" role="group" aria-label="Language / Idioma">
        <button type="button" id="lang-en" lang="en" aria-pressed="true">EN</button>
        <button type="button" id="lang-es" lang="es" aria-pressed="false">ES</button>
      </div>
      <button type="button" class="listen" id="listen" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="waves" d="M16.5 9a4 4 0 0 1 0 6M19.5 6a8 8 0 0 1 0 12"/></svg>
        <span data-t="listen">Listen</span>
      </button>
    </div>

    <div class="bar" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="count" id="count"></p>

    <form id="form" novalidate>
      <section class="step" id="step-1">
        <h1 tabindex="-1" data-t="s1h"></h1>
        <p class="hint" data-t="s1p"></p>
        <label for="name" data-t="s1l"></label>
        <input id="name" name="name" autocomplete="name" aria-describedby="err-1">
        <p class="err" id="err-1" data-t="s1e" hidden></p>
        <div class="nav"><button type="submit" class="go" data-t="next"></button></div>
      </section>

      <section class="step" id="step-2" hidden>
        <h1 tabindex="-1" data-t="s2h"></h1>
        <p class="hint" data-t="s2p"></p>
        <label for="email" data-t="s2l"></label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" aria-describedby="err-2">
        <p class="err" id="err-2" data-t="s2e" hidden></p>
        <div class="nav">
          <button type="button" data-back data-t="back"></button>
          <button type="submit" class="go" data-t="next"></button>
        </div>
      </section>

      <section class="step" id="step-3" hidden>
        <h1 tabindex="-1" data-t="s3h"></h1>
        <p class="hint" data-t="s3p"></p>
        <dl>
          <dt data-t="s1l"></dt><dd id="show-name"></dd>
          <dt data-t="s2l"></dt><dd id="show-email"></dd>
        </dl>
        <div class="nav">
          <button type="button" data-back data-t="back"></button>
          <button type="submit" class="go" data-t="send"></button>
        </div>
      </section>

      <section class="step" id="step-4" hidden>
        <h1 tabindex="-1" data-t="s4h"></h1>
        <p class="hint" data-t="s4p"></p>
        <button type="button" class="again" id="again" data-t="again"></button>
      </section>
    </form>
  </div>
  <p class="note" id="no-voice" data-t="novoice" hidden></p>
  <p class="note" data-t="note"></p>
</main>

<script src="../step-narrator.js"></script>
<script>
(function () {
  'use strict';
  var T = {
    en: {
      listen: 'Listen', voiceOn: 'Voice on.', stepOf: 'Step {n} of {t}',
      s1h: 'What is your name?', s1p: 'Type your first and last name.', s1l: 'Full name',
      s1e: 'Please type your name.',
      s2h: 'How can we reach you?', s2p: 'Type your email. We only use it to answer you.', s2l: 'Email',
      s2e: 'Please type a full email, like name@example.com.',
      s3h: 'Check and send', s3p: 'Check your answers. If they are right, tap Send.',
      s4h: 'Done. Thank you!', s4p: 'We got your answers.', again: 'Start again',
      next: 'Next', back: 'Back', send: 'Send',
      novoice: 'This browser has no voice, so the Listen button is hidden. The form still works.',
      note: 'This is a demo. It sends nothing. Your answers stay on this page.'
    },
    es: {
      listen: 'Escuchar', voiceOn: 'Voz activada.', stepOf: 'Paso {n} de {t}',
      s1h: '¿Cómo se llama?', s1p: 'Escriba su nombre y apellido.', s1l: 'Nombre completo',
      s1e: 'Por favor, escriba su nombre.',
      s2h: '¿Cómo le contactamos?', s2p: 'Escriba su correo. Solo lo usamos para responderle.', s2l: 'Correo electrónico',
      s2e: 'Escriba un correo completo, como nombre@ejemplo.com.',
      s3h: 'Revise y envíe', s3p: 'Revise sus respuestas. Si están bien, toque Enviar.',
      s4h: 'Listo. ¡Gracias!', s4p: 'Recibimos sus respuestas.', again: 'Empezar de nuevo',
      next: 'Siguiente', back: 'Atrás', send: 'Enviar',
      novoice: 'Este navegador no tiene voz, así que el botón Escuchar está oculto. El formulario funciona igual.',
      note: 'Esto es una demo. No envía nada. Sus respuestas se quedan en esta página.'
    }
  };
  var TOTAL = 3, L = 'en', step = 1;
  var N = window.StepNarrator;
  function $(id) { return document.getElementById(id); }
  function t(k) { return T[L][k]; }

  // Read what is on screen, so the words live in one place.
  function stepText() {
    var s = $('step-' + step), out = [];
    if (step <= TOTAL) out.push($('count').textContent);
    out.push(s.querySelector('h1').textContent, s.querySelector('.hint').textContent);
    return out.join('. ').replace(/([.?!¡¿])\./g, '$1');
  }
  function say(text) { if (N && N.isOn()) { N.setLang(L); N.say(text); } }

  function draw() {
    document.documentElement.lang = L;
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
      el.textContent = t(el.getAttribute('data-t'));
    });
    $('count').textContent = step <= TOTAL ? t('stepOf').replace('{n}', step).replace('{t}', TOTAL) : '';
    $('count').hidden = step > TOTAL;
    Array.prototype.forEach.call(document.querySelectorAll('.bar span'), function (b, i) {
      b.className = i < step ? 'done' : '';
    });
    $('lang-en').setAttribute('aria-pressed', L === 'en' ? 'true' : 'false');
    $('lang-es').setAttribute('aria-pressed', L === 'es' ? 'true' : 'false');
  }

  function go(n, focus) {
    step = n;
    for (var i = 1; i <= TOTAL + 1; i++) $('step-' + i).hidden = i !== n;
    if (n === 3) { $('show-name').textContent = $('name').value.trim(); $('show-email').textContent = $('email').value.trim(); }
    draw();
    if (focus) $('step-' + n).querySelector('h1').focus();
    say(stepText());
  }

  function fail(errId, inputId) {
    $(errId).hidden = false;
    $(inputId).setAttribute('aria-invalid', 'true');
    $(inputId).focus();
    say($(errId).textContent);
  }
  function ok(errId, inputId) { $(errId).hidden = true; $(inputId).removeAttribute('aria-invalid'); }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (step === 1) {
      if (!$('name').value.trim()) return fail('err-1', 'name');
      ok('err-1', 'name'); go(2, true);
    } else if (step === 2) {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('email').value.trim())) return fail('err-2', 'email');
      ok('err-2', 'email'); go(3, true);
    } else if (step === 3) {
      go(4, true); // a real form would send here; this demo sends nothing
    }
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-back]'), function (b) {
    b.addEventListener('click', function () { go(step - 1, true); });
  });
  $('again').addEventListener('click', function () { $('form').reset(); go(1, true); });

  function setLang(l) { L = l; if (N) N.stop(); draw(); say(stepText()); }
  $('lang-en').addEventListener('click', function () { setLang('en'); });
  $('lang-es').addEventListener('click', function () { setLang('es'); });

  if (N && N.supported) {
    N.bind($('listen'));
    N.onChange(function (on) { if (on) say(t('voiceOn') + ' ' + stepText()); });
  } else {
    $('no-voice').hidden = false;
  }

  go(1, false);
})();
</script>
</body>
</html>
